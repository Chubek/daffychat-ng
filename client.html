<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DaffyChat</title>
  <meta name="theme-color" content="#10141b">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.4;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10141b;
      color: #e7edf5;
    }
    main {
      width: min(680px, 92vw);
      background: #1a2230;
      border: 1px solid #2d3c52;
      border-radius: 10px;
      padding: 1.2rem 1.4rem;
      box-shadow: 0 8px 32px rgb(0 0 0 / 35%);
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    .muted { color: #9fb2ca; }
    .placeholder {
      margin-top: 1rem;
      padding: 0.8rem;
      border-radius: 8px;
      background: #111826;
      border: 1px dashed #3c4f6b;
    }
    label { display: block; margin: 0.5rem 0 0.3rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.55rem 0.65rem;
      border-radius: 6px;
      border: 1px solid #415879;
      background: #0e1521;
      color: #e7edf5;
    }
    button {
      margin-top: 0.85rem;
      padding: 0.55rem 0.85rem;
      border-radius: 6px;
      border: 1px solid #56749e;
      background: #2a4368;
      color: #f7fbff;
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.75;
    }
    #status {
      margin-top: 0.8rem;
      font-size: 0.95rem;
      color: #b9cbe2;
    }
    #callState {
      margin-top: 0.4rem;
      font-size: 0.92rem;
      color: #9fc6ff;
    }
    #roleBadge {
      margin-top: 0.35rem;
      font-size: 0.9rem;
      color: #b7d7ff;
    }
    #detailStatus {
      margin-top: 0.7rem;
      padding: 0.65rem;
      border-radius: 6px;
      border: 1px solid #334762;
      background: #0c131f;
      color: #cfe1f8;
      font: 0.78rem/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      white-space: pre-wrap;
      max-height: 220px;
      overflow: auto;
    }
    .controls {
      margin-top: 0.8rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>DaffyChat</h1>
    <p class="muted">Stage 3 baseline. Password-gated WebSocket signaling + WebRTC voice call. <a href="/guide">Open guide</a></p>
    <div class="placeholder">
      <label for="session">Session code</label>
      <input id="session" type="text" placeholder="e.g. team-sync" autocomplete="off">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="shared secret">
      <button id="joinBtn" type="button">Join</button>
      <button id="leaveBtn" type="button" disabled>Leave</button>
      <div class="controls">
        <button id="muteBtn" type="button" disabled>Mute</button>
        <button id="installBtn" type="button" hidden>Install App</button>
      </div>
      <div id="status">Idle</div>
      <div id="callState">Call state: disconnected</div>
      <div id="roleBadge">Role: unjoined</div>
      <div id="detailStatus" aria-live="polite">Detailed status timeline will appear here.</div>
      <audio id="remoteAudio" autoplay playsinline></audio>
    </div>
  </main>
  <script>
    (() => {
      const sessionInput = document.getElementById('session');
      const passwordInput = document.getElementById('password');
      const joinBtn = document.getElementById('joinBtn');
      const leaveBtn = document.getElementById('leaveBtn');
      const muteBtn = document.getElementById('muteBtn');
      const installBtn = document.getElementById('installBtn');
      const statusEl = document.getElementById('status');
      const callStateEl = document.getElementById('callState');
      const roleBadgeEl = document.getElementById('roleBadge');
      const detailStatusEl = document.getElementById('detailStatus');
      const remoteAudioEl = document.getElementById('remoteAudio');

      let joined = false;
      let sessionId = '';
      let peerId = '';
      let ws = null;
      let pc = null;
      let localStream = null;
      let localAudioPromise = null;
      let makingOffer = false;
      let isMuted = false;
      let polite = true;
      let isOfferer = false;
      let joinAcknowledged = false;
      let peerReady = false;
      let iceServers = [];
      let deferredInstallPrompt = null;
      const detailSteps = [];

      function isLocalHostLike(hostname) {
        const h = (hostname || '').toLowerCase();
        return h === 'localhost' || h === '127.0.0.1' || h === '::1';
      }

      function serverLooksLocalOnly(hostname) {
        const h = (hostname || '').toLowerCase();
        return h === 'localhost' || h === '127.0.0.1' || h === '::1' || h === '[::1]';
      }

      function normalizeIceServers(rawServers) {
        if (!Array.isArray(rawServers)) return [];
        const filtered = [];
        for (const entry of rawServers) {
          if (!entry || typeof entry !== 'object') continue;
          const urlsRaw = entry.urls;
          const urls = Array.isArray(urlsRaw) ? urlsRaw : [urlsRaw];
          const cleaned = [];
          for (const value of urls) {
            if (typeof value !== 'string') continue;
            const trimmed = value.trim();
            if (!trimmed) continue;
            const lower = trimmed.toLowerCase();
            if (!serverLooksLocalOnly(location.hostname)) {
              if (lower.includes('stun:localhost') || lower.includes('stun:127.0.0.1') || lower.includes('stun:[::1]') ||
                  lower.includes('turn:localhost') || lower.includes('turn:127.0.0.1') || lower.includes('turn:[::1]') ||
                  lower.includes('turns:localhost') || lower.includes('turns:127.0.0.1') || lower.includes('turns:[::1]')) {
                continue;
              }
            }
            cleaned.push(trimmed);
          }
          if (cleaned.length === 0) continue;
          const out = {urls: cleaned.length === 1 ? cleaned[0] : cleaned};
          if (typeof entry.username === 'string' && entry.username.length > 0) out.username = entry.username;
          if (typeof entry.credential === 'string' && entry.credential.length > 0) out.credential = entry.credential;
          filtered.push(out);
        }
        return filtered;
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function currentRoleLabel() {
        if (!joinAcknowledged) return 'unjoined';
        return isOfferer ? 'offerer' : 'answerer';
      }

      function refreshRoleBadge() {
        roleBadgeEl.textContent = 'Role: ' + currentRoleLabel();
      }

      function pushDetail(step) {
        const stamp = new Date().toLocaleTimeString();
        detailSteps.push('[' + stamp + '] [' + currentRoleLabel() + '] ' + step);
        if (detailSteps.length > 80) {
          detailSteps.splice(0, detailSteps.length - 80);
        }
        detailStatusEl.textContent = detailSteps.join('\n');
        detailStatusEl.scrollTop = detailStatusEl.scrollHeight;
      }

      function setCallState(text) {
        callStateEl.textContent = 'Call state: ' + text;
        pushDetail('Call state changed: ' + text);
      }

      function setJoinedState(value) {
        joined = value;
        if (!value) {
          peerReady = false;
          polite = true;
          isOfferer = false;
          joinAcknowledged = false;
        }
        refreshRoleBadge();
        joinBtn.disabled = value;
        leaveBtn.disabled = !value;
        sessionInput.disabled = value;
        passwordInput.disabled = value;
        muteBtn.disabled = !value || !localStream;
      }

      function resetClientState(reason) {
        pushDetail('Resetting client state' + (reason ? ': ' + reason : ''));
        if (reason) setStatus(reason);
        setJoinedState(false);
        closePeerConnection();
        stopLocalStream();
        if (ws) {
          try { ws.close(); } catch (_) {}
        }
        ws = null;
        sessionId = '';
        peerId = '';
      }

      async function loadServerConfig() {
        try {
          const res = await fetch('/api/config', {method: 'GET'});
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.ok && Array.isArray(data.ice_servers) && data.ice_servers.length > 0) {
            const sanitized = normalizeIceServers(data.ice_servers);
            if (sanitized.length > 0) {
              iceServers = sanitized;
            } else {
              iceServers = [];
              if (!isLocalHostLike(location.hostname)) {
                setStatus('Server ICE config looked local-only; ask admin to set reachable STUN/TURN');
              }
            }
          }
        } catch (_) {
        }
      }

      function connectWebSocket() {
        return new Promise((resolve, reject) => {
          pushDetail('Opening signaling socket');
          const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
          const socket = new WebSocket(proto + location.host + '/ws');
          const timer = setTimeout(() => {
            socket.close();
            reject(new Error('websocket timeout'));
          }, 8000);

          socket.onopen = () => {
            clearTimeout(timer);
            ws = socket;
            pushDetail('Signaling socket connected');
            resolve(socket);
          };

          socket.onerror = () => {
            clearTimeout(timer);
            pushDetail('Signaling socket error');
            reject(new Error('websocket connection failed'));
          };

          socket.onclose = () => {
            pushDetail('Signaling socket closed');
            if (joined) {
              resetClientState('Signaling disconnected');
            }
          };

          socket.onmessage = async (ev) => {
            try {
              let msg = {};
              try { msg = JSON.parse(ev.data); } catch (_) { return; }
              pushDetail('Received signal: ' + (msg.type || 'unknown'));
              if (msg.type === 'hello') return;
              if (msg.type === 'error') {
                const errorText = msg.error || 'unknown';
                pushDetail('Signal error received: ' + errorText);
                setStatus('Signal error: ' + errorText);
                if (errorText === 'rate limit' || errorText === 'invalid password' || errorText === 'session full') {
                  resetClientState('Disconnected: ' + errorText);
                }
                return;
              }
              if (msg.type === 'joined') {
                peerId = msg.peer_id;
                joinAcknowledged = true;
                isOfferer = msg.state === 'waiting';
                polite = !isOfferer;
                peerReady = msg.state === 'paired';
                refreshRoleBadge();
                pushDetail('Joined session as ' + currentRoleLabel() + '; session state=' + msg.state);
                setJoinedState(true);
                setStatus(msg.state === 'paired' ? 'Joined; peer already present' : 'Joined; waiting for peer');
                if (peerReady) {
                  await ensurePeerConnection();
                  if (isOfferer) {
                    await ensureLocalAudio();
                  }
                }
                return;
              }
              if (msg.type === 'peer-ready') {
                if (!joinAcknowledged) {
                  pushDetail('Ignoring out-of-order peer-ready before join acknowledgement');
                  return;
                }
                peerReady = true;
                pushDetail('Peer-ready received');
                setStatus(isOfferer ? 'Peer connected; preparing call' : 'Peer connected; waiting for offer');
                await ensurePeerConnection();
                if (isOfferer) {
                  await ensureLocalAudio();
                }
                return;
              }
              if (msg.type === 'offer') {
                peerReady = true;
                pushDetail('Inbound offer received');
                return handleOffer(msg.payload || {});
              }
              if (msg.type === 'answer') {
                peerReady = true;
                pushDetail('Inbound answer received');
                return handleAnswer(msg.payload || {});
              }
              if (msg.type === 'ice-candidate') {
                peerReady = true;
                pushDetail('Inbound ICE candidate received');
                return handleIce(msg.payload || {});
              }
              if (msg.type === 'bye') {
                peerReady = false;
                pushDetail('Peer disconnected (bye)');
                setStatus('Peer left');
                closePeerConnection();
              }
            } catch (err) {
              pushDetail('Call setup exception: ' + (err && err.message ? err.message : 'unknown'));
              setStatus('Call setup error: ' + (err && err.message ? err.message : 'unknown'));
            }
          };
        });
      }

      function sendWs(obj) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          throw new Error('signaling socket closed');
        }
        pushDetail('Sending signal: ' + (obj && obj.type ? obj.type : 'unknown'));
        ws.send(JSON.stringify(obj));
      }

      async function sendSignal(type, payload) {
        sendWs({type, payload});
      }

      function closePeerConnection() {
        if (pc) {
          pushDetail('Closing peer connection');
          try { pc.close(); } catch (_) {}
          pc = null;
        }
        remoteAudioEl.srcObject = null;
        setCallState('disconnected');
      }

      function stopLocalStream() {
        if (!localStream) return;
        pushDetail('Stopping local microphone stream');
        for (const track of localStream.getTracks()) track.stop();
        localStream = null;
        localAudioPromise = null;
        muteBtn.disabled = true;
        muteBtn.textContent = 'Mute';
        isMuted = false;
      }

      function ensureLocalTracksOnConnection(conn) {
        if (!conn || !localStream) return;
        const senderTrackIds = new Set(
          conn.getSenders()
            .map((sender) => sender.track && sender.track.id)
            .filter((id) => typeof id === 'string' && id.length > 0)
        );
        for (const track of localStream.getAudioTracks()) {
          if (senderTrackIds.has(track.id)) continue;
          pushDetail('Attaching local audio track to peer connection');
          conn.addTrack(track, localStream);
        }
      }

      async function ensurePeerConnection() {
        if (pc) return pc;
        pushDetail('Creating RTCPeerConnection');
        pc = new RTCPeerConnection({
          iceServers
        });
        if (iceServers.length === 0) {
          setStatus('No ICE servers configured; local/LAN calls may still work');
        }

        pc.onconnectionstatechange = () => {
          setCallState(pc.connectionState || 'unknown');
          if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
            setStatus('Connection ended');
          }
        };

        pc.onicecandidate = async (ev) => {
          if (!ev.candidate || !joined || !peerReady) return;
          try {
            pushDetail('Local ICE candidate discovered');
            await sendSignal('ice-candidate', ev.candidate.toJSON());
          } catch (_) {
            pushDetail('Failed to send ICE candidate');
          }
        };

        pc.ontrack = (ev) => {
          if (!ev.streams || ev.streams.length === 0) return;
          remoteAudioEl.srcObject = ev.streams[0];
          const playPromise = remoteAudioEl.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(() => {});
          }
          pushDetail('Remote audio track received');
          setStatus('Receiving remote audio');
        };

        pc.onnegotiationneeded = async () => {
          if (!joined || !joinAcknowledged || !peerReady || makingOffer || !isOfferer) return;
          try {
            makingOffer = true;
            pushDetail('Negotiation needed; creating offer');
            await ensureLocalAudio();
            await pc.setLocalDescription(await pc.createOffer());
            await sendSignal('offer', {sdp: pc.localDescription.sdp, type: pc.localDescription.type});
            setStatus('Offer sent');
          } catch (err) {
            pushDetail('Offer creation failed: ' + err.message);
            setStatus('Offer error: ' + err.message);
          } finally {
            makingOffer = false;
          }
        };

        ensureLocalTracksOnConnection(pc);
        return pc;
      }

      async function ensureLocalAudio() {
        if (localStream) {
          const existingConn = await ensurePeerConnection();
          ensureLocalTracksOnConnection(existingConn);
          muteBtn.disabled = false;
          pushDetail('Reusing existing local microphone stream');
          return localStream;
        }
        if (localAudioPromise) return localAudioPromise;
        if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Microphone requires HTTPS (or localhost) in this browser');
        }
        localAudioPromise = (async () => {
          pushDetail('Requesting microphone access');
          localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: false});
          const conn = await ensurePeerConnection();
          ensureLocalTracksOnConnection(conn);
          muteBtn.disabled = false;
          pushDetail('Microphone access granted');
          setStatus('Microphone granted');
          return localStream;
        })();
        try {
          return await localAudioPromise;
        } finally {
          localAudioPromise = null;
        }
      }

      async function handleOffer(payload) {
        peerReady = true;
        pushDetail('Applying remote offer');
        const conn = await ensurePeerConnection();
        const offerCollision = makingOffer || conn.signalingState !== 'stable';
        if (!polite && offerCollision) return;
        await conn.setRemoteDescription({type: payload.type || 'offer', sdp: payload.sdp});
        await ensureLocalAudio();
        await conn.setLocalDescription(await conn.createAnswer());
        await sendSignal('answer', {sdp: conn.localDescription.sdp, type: conn.localDescription.type});
        pushDetail('Answer created and sent');
        setStatus('Answer sent');
      }

      async function handleAnswer(payload) {
        pushDetail('Applying remote answer');
        const conn = await ensurePeerConnection();
        await conn.setRemoteDescription({type: payload.type || 'answer', sdp: payload.sdp});
        setStatus('Answer applied');
      }

      async function handleIce(payload) {
        const conn = await ensurePeerConnection();
        if (!payload || !payload.candidate) return;
        try {
          await conn.addIceCandidate(payload);
          pushDetail('Remote ICE candidate applied');
        } catch (_) {
          pushDetail('Remote ICE candidate rejected');
        }
      }

      async function join() {
        const s = sessionInput.value.trim();
        const p = passwordInput.value;
        if (!s) return setStatus('Session code required');
        if (!p) return setStatus('Password required');

        joinBtn.disabled = true;
        pushDetail('Join requested for session: ' + s);
        try {
          sessionId = s;
          await connectWebSocket();
          sendWs({type: 'join', session: s, password: p});
        } catch (err) {
          pushDetail('Join failed: ' + err.message);
          setStatus('Join failed: ' + err.message);
          joinBtn.disabled = false;
          closePeerConnection();
          stopLocalStream();
        }
      }

      async function leave() {
        if (!joined) return;
        pushDetail('Leave requested');
        const socket = ws;
        setJoinedState(false);
        sessionId = '';
        peerId = '';
        setStatus('Left session');
        closePeerConnection();
        stopLocalStream();
        try {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({type: 'leave'}));
            socket.close();
          }
        } catch (_) {
        }
        ws = null;
      }

      function toggleMute() {
        if (!localStream) return;
        isMuted = !isMuted;
        for (const track of localStream.getAudioTracks()) track.enabled = !isMuted;
        muteBtn.textContent = isMuted ? 'Unmute' : 'Mute';
        pushDetail(isMuted ? 'Microphone muted' : 'Microphone unmuted');
        setStatus(isMuted ? 'Microphone muted' : 'Microphone unmuted');
      }

      joinBtn.addEventListener('click', join);
      leaveBtn.addEventListener('click', leave);
      muteBtn.addEventListener('click', toggleMute);
      installBtn.addEventListener('click', async () => {
        if (!deferredInstallPrompt) {
          setStatus('Install prompt unavailable in this browser/session');
          return;
        }
        deferredInstallPrompt.prompt();
        try {
          await deferredInstallPrompt.userChoice;
        } catch (_) {
        }
        deferredInstallPrompt = null;
        installBtn.hidden = true;
      });
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        installBtn.hidden = false;
      });
      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        installBtn.hidden = true;
        setStatus('App installed');
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
      loadServerConfig();
      window.addEventListener('beforeunload', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          try { ws.send(JSON.stringify({type: 'leave'})); } catch (_) {}
        }
      });
    })();
  </script>
</body>
</html>
